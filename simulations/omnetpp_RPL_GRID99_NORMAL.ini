# =========================================================
# BASELINE: RPL sobre IEEE 802.15.4 (99 hosts + 1 sink, grade 10x10)
# Irmã maior da RplNetworkGrid35/48/63 (mesma abordagem validada,
# escalada de 8x8/63 hosts pra 10x10/99 hosts).
#
# RESSALVA — PDR do baseline É DELIBERADAMENTE menor que nas topologias
# anteriores (alvo ~95%, vs. 99,87% na GRID63): rede fisicamente maior
# tem mais saltos até o sink pros nós mais distantes, aumentando a
# chance real de falha de entrega ao longo do caminho — reaproveita a
# calibração da GRID63 (macMaxFrameRetries=1 + sigma elevado) como ponto
# de partida, escalando mais se necessário — ver bloco RESULTADO
# VALIDADO no Config Grid99_Normal pra calibração/números reais.
#
# RESSALVA 1 — dependência escondida fora deste arquivo (idêntica à das
# outras 3 topologias):
# O PDR depende de uma correção feita em src/Rpl.cc (compilada em
# libMAIO_RPL27.so), NÃO deste .ini. Sem ela, destAddresses="sink[0]" resolve
# para o endereço link-local do sink (raEnabled=false => nenhum nó forma
# endereço global via SLAAC) e o INET recusa encaminhar link-local além de 1
# salto — derrubando o PDR pra só os vizinhos diretos do sink entregarem. A
# correção assina um endereço global adicional (fd00::/8) em Rpl::start().
#
# RESSALVA 2 — isto NÃO é uma pilha 6LoWPAN completa:
# É RPL rodando direto sobre IPv6 + MAC IEEE 802.15.4. Não há camada de
# adaptação 6LoWPAN (sem compressão IPHC / RFC 6282, sem fragmentação) —
# RplRouter/AdhocHost não implementam isso. Tratar como baseline de "RPL
# sobre 802.15.4", não de "RPL sobre 6LoWPAN".
# =========================================================

[General]
network = RplNetworkGrid99
sim-time-limit = 3600s

# =========================================================
# ESCALABILIDADE / REPETIÇÕES
# =========================================================
**.numNodes = 99        # 99 sensores + 1 sink = 100 nós (grade 10x10)
warmup-period = 80s      # tempo de aquecimento antes de coletar métricas
repeat = 1000              # aumente para 1000 em rodadas estatísticas finais
num-rngs = 10





**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# =========================================================
# CONFIGURAÇÕES DE REDE
# =========================================================
**.hasIpv6 = true
**.hasIpv4 = false
**.mtu = 1500B

**.neighbourDiscovery.raEnabled = false
**.neighbourDiscovery.addRandomDelays = true
**.neighbourDiscovery.skipDad = true

# =========================================================
# PHY
# =========================================================
**.radioMedium.typename = "Ieee802154NarrowbandDimensionalRadioMedium"
**.radio.typename = "Ieee802154NarrowbandDimensionalRadio"

# Propagação: mesma calibração da GRID63 como ponto de partida (sigma
# bem acima do padrão GRID35/48, que era 6.0) pra introduzir perda
# natural real na rede maior.
**.radioMedium.backgroundNoise.power = -110dBm
**.radioMedium.attenuation.typename = "LogNormalShadowing"
**.radioMedium.attenuation.pathLossExponent = 3.5
**.radioMedium.attenuation.sigma = 60.0

# =========================================================
# MAC
# =========================================================
**.wlan[*].typename = "Ieee802154NarrowbandInterface"
**.wlan[*].mac.typename = "Ieee802154Mac"

**.wlan[0].radio.transmitter.bitrate = 250kbps
**.wlan[0].radio.receiver.sensitivity = -85dBm
**.wlan[0].radio.transmitter.power = 1mW
# Mesma calibração da GRID63: permite 1 retentativa (preserva delay/
# energia realista), sem mascarar toda perda como o padrão INET (3) faria.
**.wlan[0].mac.macMaxFrameRetries = 0

# =========================================================
# RPL
# =========================================================
**.sink[*].rpl.isRoot = true
**.sink[*].rpl.storing = true
**.rpl.numDaoRetransmitAttempts = 10
**.rpl.daoEnabled = true
**.rpl.poisoning = false
**.rpl.useBackupAsPreferred = false
**.rpl.networkProtocolModule = "^.ipv6.ipv6"
**.rpl.routingTableModule = "^.ipv6.routingTable"
**.rpl.drawConnectors = true

# =========================================================
# TOPOLOGIA: GRADE 10x10 (100 posições), 99 hosts + 1 sink
# Espaçamento de 40m entre nós vizinhos (mesmo espaçamento das outras)
# =========================================================
**.numSinks = 1

**.sink[*].mobility.typename   = "StationaryMobility"
*.host[*].mobility.typename    = "StationaryMobility"
*.sink[*].mobility.initFromDisplayString = false
*.host[*].mobility.initFromDisplayString = false

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 440m
**.mobility.constraintAreaMaxY = 440m

*.sink[*].mobility.initialZ = 0m
*.host[*].mobility.initialZ = 0m

# Sink numa das 4 células mais centrais da grade 10x10 (não há centro
