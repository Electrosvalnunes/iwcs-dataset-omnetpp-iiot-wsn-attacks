# =========================================================
# CONFIG: cenário normal (sem ataque) — usa o [General] diretamente
# =========================================================
[Config Grid99_Normal]
description = "Rede 99 sensores + 1 sink central, grade 10x10, tráfego RPL/UDP legítimo, sem ataque"

# =========================================================
# CALIBRAÇÃO (histórico): reaproveitando a combinação da GRID63
# (macMaxFrameRetries=1 + sigma=60) o PDR ficou em 99,98% — praticamente
# sem efeito, mesmo com mais saltos (rank até 11). Testado depois, na
# ordem:
#   macMaxFrameRetries=0 (zera retransmissão): 98,88%
#   + macMaxCSMABackoffs=2/macMinBE=1: 98,99% (quase igual), mas o delay
#     CAIU abaixo do baseline da GRID63 — descartado, viola o requisito
#     de delay maior
#   + reduzir potência (0,7mW, depois 0,55mW): sem efeito adicional
#     nenhum (saturado, igual ao já visto na GRID63)
#   Aumentar a taxa de tráfego dos sensores (55s -> 30s -> 18s -> 6s):
#     30s: PDR 97,95%, energia já subiu pra 7,48J
#     18s: PDR 97,95%->98,27% (subiu, não ajudou), mas delay/energia
#          continuaram subindo (delay máx 104ms, energia 7,69J)
#     6s (FINAL): PDR 94,28% — bateu a meta de ~95%, com delay e energia
#          claramente acima da GRID63
#
# Decisão: aumentar a taxa de tráfego (não só parâmetros de PHY/MAC) foi
# necessário pra essa topologia — os ajustes de rádio/MAC puros
# saturavam bem antes de chegar na meta de PDR, mesmo tendo funcionado
# (parcialmente) nas topologias anteriores.
# =========================================================

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
#   PDR:              53971/57246 = 94.28% — na meta de ~95% pedida (vs.
#                      99,87% na GRID63 — bem mais impactado, como pedido)
#   Delay médio:      29.02ms (vs. 23,29ms na GRID63 — maior, como pedido)
#   Delay máximo:      91.62ms (vs. 51,68ms na GRID63 — bem maior)
#   Energia/host:      8.81J médio de 1500J (vs. 7,31J na GRID63 — maior,
#                      como pedido; reflete tanto mais saltos quanto a
#                      taxa de tráfego mais alta necessária pra calibrar
#                      o PDR)
#   Energia rede toda: 872.56J (vs. 460,76J na GRID63 — quase o dobro,
#                      mas parte disso é só o tráfego mais frequente, não
#                      só o tamanho da rede)
#   Rank:              sink=1, hosts até 11 (vs. até 9 na GRID63 — mais
#                      saltos, coerente com a grade maior)
#   DODAG:             converge de forma saudável, 0 nós órfãos (INF_RANK)
#
# Parâmetros finais:
#   macMaxFrameRetries = 1 (mesmo valor da GRID63, preserva delay/energia
#                      realista)
#   sigma = 60.0 (mesmo valor da GRID63, mantido por ser fisicamente
#                      justificável mesmo não sendo o fator dominante)
#   sendInterval = 6s (reduzido de 55s — ÚNICA mudança de tráfego entre
#                      as 4 topologias; necessária porque os parâmetros
#                      de PHY/MAC puros saturavam antes de atingir a
#                      meta de PDR nesta rede maior)
#
# RESSALVA IMPORTANTE: diferente das GRID35/48/63 (todas com o mesmo
# sendInterval=55s), esta topologia usa 6s — as comparações de energia/
# throughput com as topologias anteriores NÃO isolam puramente o efeito
# do tamanho da rede, misturam também o efeito do tráfego mais frequente.
# =========================================================

# =========================================================
# CONFIG: ataque Blackhole — host[53] como nó comprometido
#
# Mecanismo idêntico ao já validado nas outras 3 topologias
# (shouldBlackholeDrop + maliciousRank em Rpl.cc/.h/.ned) — nenhuma
# mudança de código, só parâmetros novos no .ini.
#
# Seleção do nó: reconstruída a árvore real de encaminhamento a partir
# dos dados de rank/parentId do baseline Grid99_Normal:
#
#   host[53] (vizinho direto SUL do sink, 200m,240m, rank=2) -> 45
#            descendentes (45,9% dos 98 outros hosts) — disparado o mais
#            forte de todos os 4 vizinhos diretos, e proporcionalmente
#            muito maior que o melhor candidato de qualquer topologia
#            anterior (GRID63: host[27] tinha 35%)
#   host[44] (vizinho direto LESTE, rank=2):    28 descendentes (28,6%)
#   host[34] (vizinho direto NORTE, rank=2):    12 descendentes (12,2%)
#   host[43] (vizinho direto OESTE, rank=2):    10 descendentes (10,2%)
#
# host[53] escolhido por ser o mais forte com folga — dado esse alcance
# estrutural já bem maior que o GRID63, o impacto agregado deve superar
# a GRID63 (PDR 55,21%) mesmo sem qualquer ajuste adicional.
#
# JANELA DE TEMPO: mesma padronizada (100s-3400s).
# =========================================================
[Config Grid99_Blackhole_Host53]
extends = Grid99_Normal
description = "Blackhole+Sinkhole: host[53] falsifica rank=1 via DIO e descarta tráfego de trânsito, ativo de t=100s a t=3400s"

**.host[53].rpl.maliciousRank = 1
**.host[53].rpl.attackStartTime = 100s
**.host[53].rpl.attackEndTime = 3400s

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
#   PDR:              29696/57246 = 51.87% (vs. 55,21% na GRID63 — mais
#                      severo, como pedido, sem precisar de nenhum ajuste
#                      extra — a sub-árvore de 45,9% já era bem maior que
#                      qualquer candidato das topologias anteriores)
#   Delay médio:      26.00ms (vs. 29,02ms no baseline Grid99 — mais
#                      baixo, mesmo viés de sobrevivência observado nas
#                      outras 3 topologias: só chegam pacotes que não
#                      foram descartados no caminho)
#   Delay máximo:      91.11ms
#   Energia host[53]: 10,36J — praticamente igual ao esperado pra um nó
#                      normal nesta topologia (baseline médio 8,81J,
#                      mas host[53] especificamente forwarda MUITO
#                      tráfego legítimo no cenário normal, dado seu
#                      papel estrutural de "hub" de quase metade da
#                      rede — sob ataque ele PARA de retransmitir esse
#                      volume, então o comparativo correto não é o
#                      average da rede, é o consumo do PRÓPRIO nó no
#                      baseline normal, que tende a ser mais alto que a
#                      média por ser um hub)
#   Energia rede toda: 860,02J (vs. 872,56J no baseline, -1,4% — mesmo
#                      achado de sempre: blackhole não tem assinatura
#                      energética de rede, só redireciona/descarta
#                      tráfego que já existia)
#   Rank host[53]:    reverte para 2 (real) ao fim da simulação, confirma
#                      que a janela de ataque desativa corretamente
#
# Reutilizou 100% do mecanismo já validado nas outras 3 topologias
# (shouldBlackholeDrop + maliciousRank em Rpl.cc/.h/.ned) sem nenhuma
# mudança de código.
# =========================================================

# =========================================================
# CONFIG: ataque Flooding — host[53] inunda o sink de tráfego UDP
#
# Mesmo nó (host[53]) e mesmo mecanismo já validado nas outras 3
# topologias: porta separada (1001) pro flood, sink com bateria pequena
# (55J), taxa inicial de 250pkt/s (0.004s) — igual à taxa final da
# GRID63, já que o limiar de saturação é uma propriedade do RÁDIO/link
# direto atacante-sink, não do tamanho da rede. Testar abaixo e escalar
# se necessário, já que o tráfego legítimo de fundo aqui é bem mais
# denso (6s/nó, não 55s) — a rede já está mais ocupada de partida.
# =========================================================
[Config Grid99_Flooding_Host53]
extends = Grid99_Normal
description = "Flooding: host[53] inunda o sink com UDP extra, ativo de t=100s a t=3400s"

**.vector-recording = false
**.sink[*].energyStorage.residualEnergyCapacity:vector.record = true

**.sink[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.sink[*].energyStorage.nominalCapacity = 55J
**.sink[*].energyStorage.initialCapacity = 55J
**.sink[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[53].numApps = 2
**.host[53].app[1].typename = "UdpBasicApp"
**.host[53].app[1].destAddresses = "sink[0]"
**.host[53].app[1].destPort = 1001
**.host[53].app[1].messageLength = 152B
**.host[53].app[1].sendInterval = 0.004s
**.host[53].app[1].startTime = 100s
**.host[53].app[1].stopTime = 3400s

**.host[53].app[1].packetSent:count.record = true
**.host[53].app[1].recordStats = true

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0, taxa 250pkt/s/0.004s — mesma
# da GRID63, funcionou de primeira sem precisar escalar)
#
#   PDR legítimo (porta 1000): 18911/57246 = 33.03% (vs. 43,05% na
#                      GRID63 — bem mais severo, como pedido; o tráfego
#                      de fundo já mais denso (6s/nó) desta topologia
#                      colide mais com o flood do que nas outras 3)
#   PDR do flood (porta 1001): 39/825000 = 0.00% — canal genuinamente
#                      saturado, mesmo padrão das outras 3 topologias
#   Delay médio:        44.50ms (vs. 40,01ms na GRID63 — maior)
#   Delay máximo:        1259.64ms (vs. 1190,90ms na GRID63 — maior)
#   Energia do sink:    2.07J de 55J restantes (3,8%) — perto de morrer
#                      mas sem cruzar o bug do ModuleCrashOperation
#   Energia host[53]:  203.98J — na mesma ordem de grandeza das outras
#                      3 topologias (~215J), levemente menor aqui,
#                      provavelmente porque o tráfego de fundo mais
#                      denso já disputa parte do canal antes mesmo do
#                      flood, reduzindo um pouco quantas transmissões de
#                      flood o atacante consegue de fato completar
#   Energia rede toda: 1126.90J (vs. 872,56J no baseline, +29,1%)
#
# Reutilizou a mesma taxa final da GRID63 sem precisar de calibração
# adicional — a rede já mais densa desta topologia (tráfego de fundo
# de 6s) foi suficiente pra tornar o ataque mais severo por si só.
# =========================================================

# =========================================================
# CONFIG: ataque Wormhole QUÁDRUPLO — 4 túneis independentes
#
# Direto com 4 túneis (aprendizado da GRID63: 1 túnel = ~16 nós
# capturados, tamanho absoluto praticamente fixo; 2 túneis dobraram pra
# 32 nós e bateram a meta). Nesta rede de 98 outros hosts, mesmo 2
# túneis (~32 nós, 32,7%) provavelmente não bastariam pra superar os
# 33,03% de PDR do Flooding ou os 51,87% do Blackhole desta topologia —
# foi direto pros 4 vizinhos diretos do sink (N/S/E/W, os mais fortes
# possíveis) cada um pareado com o nó mais distante do lado oposto da
# grade:
#
#   Túnel 1: host[53] (S, 45 desc. naturais) <-> host[4]  (N, borda longe)
#   Túnel 2: host[44] (E, 28 desc. naturais) <-> host[40] (W, borda longe)
#   Túnel 3: host[34] (N, 12 desc. naturais) <-> host[93] (S, borda longe)
#   Túnel 4: host[43] (W, 10 desc. naturais) <-> host[48] (E, borda longe)
#
# Mesmo mecanismo (maliciousRank=1, per=0.15/20kbps padrão) replicado
# pros 4 pares. Mesma janela de tempo (100s-3400s) pra todos.
# =========================================================
[Config Grid99_Wormhole_Quadruplo]
extends = Grid99_Normal
description = "Wormhole quádruplo: 4 túneis independentes (host53<->host4, host44<->host40, host34<->host93, host43<->host48), ativos de t=100s a t=3400s"

**.wormholeEnabled = true

**.host[53].numPppInterfaces = 1
**.host[4].numPppInterfaces = 1
**.host[44].numPppInterfaces = 1
**.host[40].numPppInterfaces = 1
**.host[34].numPppInterfaces = 1
**.host[93].numPppInterfaces = 1
**.host[43].numPppInterfaces = 1
**.host[48].numPppInterfaces = 1

**.host[4].rpl.maliciousRank = 1
**.host[4].rpl.attackStartTime = 100s
**.host[4].rpl.attackEndTime = 3400s
**.host[4].rpl.wormholeTunnelEndpoint = true
**.host[4].rpl.wormholePeerPath = "RplNetworkGrid99.host[53]"

**.host[40].rpl.maliciousRank = 1
**.host[40].rpl.attackStartTime = 100s
**.host[40].rpl.attackEndTime = 3400s
**.host[40].rpl.wormholeTunnelEndpoint = true
**.host[40].rpl.wormholePeerPath = "RplNetworkGrid99.host[44]"

**.host[93].rpl.maliciousRank = 1
**.host[93].rpl.attackStartTime = 100s
**.host[93].rpl.attackEndTime = 3400s
**.host[93].rpl.wormholeTunnelEndpoint = true
**.host[93].rpl.wormholePeerPath = "RplNetworkGrid99.host[34]"

**.host[48].rpl.maliciousRank = 1
**.host[48].rpl.attackStartTime = 100s
**.host[48].rpl.attackEndTime = 3400s
**.host[48].rpl.wormholeTunnelEndpoint = true
**.host[48].rpl.wormholePeerPath = "RplNetworkGrid99.host[43]"

**.host[53].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[4].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[44].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[40].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[34].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[93].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[43].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[48].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0) — funcionou de primeira com
# 4 túneis, sem precisar de nenhum ajuste adicional
#
#   PDR:                17713/57246 = 30.94% (vs. 54,18% na GRID63 —
#                      MUITO mais severo, meta batida com folga)
#   Sub-árvore túnel 1 (host4):  15 nós
#   Sub-árvore túnel 2 (host40): 15 nós
#   Sub-árvore túnel 3 (host93): 23 nós
#   Sub-árvore túnel 4 (host48): 22 nós
#   Sub-árvore combinada:        75 nós únicos (76,5% dos 98 outros
#                      hosts) — os 4 túneis capturam regiões diferentes
#                      da rede quase sem sobreposição
#   Delay médio:        80.13ms (vs. 29,02ms no baseline — quase o
#                      triplo; vs. 44,79ms no túnel duplo da GRID63)
#   Delay máximo:        417.60ms — bate com a assinatura dos túneis
#                      (300ms cada)
#   Energia dos 8 atacantes: 28,86J a 31,33J cada — todos na mesma faixa
#                      (~29J) das outras topologias e do túnel duplo
#   Energia rede toda:  965.36J (vs. 872,56J no baseline, +10,6%)
#
# Custo: 8 nós comprometidos em vez de 2 (GRID35/48) ou 4 (GRID63), mas
# o pedido era impacto agregado maior, alcançado com folga em PDR e delay.
# =========================================================

# =========================================================
# CONFIG: ataque Backoff Manipulado — host[53] desliga o CSMA/CA
#
# Mesmo nó (host[53]) já usado no Blackhole/Flooding/Wormhole desta
# topologia, mesma taxa final calibrada nas outras 3 topologias
# (55pkt/s / 0,0182s) como ponto de partida — testar abaixo e escalar
# se necessário pra garantir impacto maior que a GRID63 (PDR 77,42%).
# =========================================================
[Config Grid99_Backoff_Host53]
extends = Grid99_Normal
description = "Backoff Manipulado: host[53] zera o CSMA/CA (macMinBE=macMaxBE=macMaxCSMABackoffs=0), monopolizando o canal de rádio contra os vizinhos"

**.host[53].wlan[0].mac.macMinBE = 0
**.host[53].wlan[0].mac.macMaxBE = 0
**.host[53].wlan[0].mac.macMaxCSMABackoffs = 0

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[53].numApps = 2
**.host[53].app[1].typename = "UdpBasicApp"
**.host[53].app[1].destAddresses = "sink[0]"
**.host[53].app[1].destPort = 1001
**.host[53].app[1].messageLength = 152B
**.host[53].app[1].sendInterval = 0.0182s
**.host[53].app[1].startTime = 100s
**.host[53].app[1].stopTime = 3400s
**.host[53].app[1].packetSent:count.record = true

