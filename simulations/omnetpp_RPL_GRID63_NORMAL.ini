# =========================================================
# BASELINE: RPL sobre IEEE 802.15.4 (63 hosts + 1 sink, grade 8x8)
# Irmã maior da RplNetworkGrid35/RplNetworkGrid48 (mesma abordagem
# validada, escalada de 7x7/48 hosts pra 8x8/63 hosts).
#
# RESSALVA — PDR do baseline NÃO é 100% aqui, diferente do GRID35/GRID48:
# rede fisicamente maior significa mais saltos até o sink pros nós mais
# distantes (diagonal máxima ~453m vs ~396m no GRID48 vs ~340m no
# GRID35), o que aumenta a chance real de falha de entrega em algum
# salto ao longo do caminho, mesmo sem nenhum ataque — ver bloco
# RESULTADO VALIDADO no Config Grid63_Normal pra calibração/números reais.
#
# CALIBRAÇÃO (histórico, várias tentativas até chegar na versão final
# usada abaixo):
#   1) Com os mesmos parâmetros da GRID35/GRID48 (sigma=6.0,
#      macMaxFrameRetries=3 padrão), PDR ficava 100.00% mesmo com mais
#      saltos (rank até 9) — o MAC absorve quase toda perda aleatória via
#      retransmissão automática, e o tráfego (55s/nó) é raro demais pra
#      gerar colisão real sozinho.
#   2) Reduzir a potência de transmissão criou um limiar abrupto demais
#      (100%<->0% de PDR sem meio-termo estável entre 0.4mW e 0.5mW —
#      abaixo disso a própria formação da DODAG falhava).
#   3) macMaxFrameRetries=0 (zerar retransmissão) FUNCIONOU pra derrubar
#      o PDR (98.26%), mas introduziu um viés sério: pacotes que teriam
#      sido recuperados por retransmissão em vez disso são descartados
#      na hora e NUNCA contam na estatística de delay — isso fazia o
#      delay/energia da GRID63 saírem MENORES que os da GRID48, o
#      oposto do fisicamente esperado (rede maior deveria ter delay e
#      energia MAIORES, não menores). Motivo real: só sobram na média os
#      pacotes "fáceis" que não precisaram de retentativa.
#   4) Versão FINAL: macMaxFrameRetries=1 (mantém pelo menos 1 retentativa,
#      preservando o delay/energia real de quem precisa retransmitir) +
#      sigma=60.0 (bem acima do original). PDR final 99.87% — não chega
#      exatamente aos ~98% inicialmente cogitados, mas delay (23,29ms) e
#      energia (7,31J) ficaram corretamente ACIMA da GRID48 (19,93ms /
#      7,28J), que é o efeito fisicamente correto de uma rede maior.
#      Testado à exaustão (sigma até 60 satura sem mais efeito além de
#      um certo ponto, aumentar macMinBE só piora o delay sem ajudar o
#      PDR, reduzir potência/aumentar ruído de fundo não muda nada) —
#      a perda residual de ~0,13% parece ser um piso estrutural de
#      colisão MAC neste volume de tráfego esparso, resistente a mais
#      ajuste de PHY sem sacrificar a correção física do delay/energia.
#      Decisão: priorizar delay/energia corretos sobre PDR exato.
#
# RESSALVA 1 — dependência escondida fora deste arquivo (idêntica à do
# GRID35/GRID48):
# O PDR depende de uma correção feita em src/Rpl.cc (compilada em
# libMAIO_RPL27.so), NÃO deste .ini. Sem ela, destAddresses="sink[0]" resolve
# para o endereço link-local do sink (raEnabled=false => nenhum nó forma
# endereço global via SLAAC) e o INET recusa encaminhar link-local além de 1
# salto — derrubando o PDR pra só os vizinhos diretos do sink entregarem. A
# correção assina um endereço global adicional (fd00::/8) em Rpl::start().
#
# RESSALVA 2 — isto NÃO é uma pilha 6LoWPAN completa:
# É RPL rodando direto sobre IPv6 + MAC IEEE 802.15.4. Não há camada de
# adaptação 6LoWPAN (sem compressão IPHC / RFC 6282, sem fragmentação) —
# RplRouter/AdhocHost não implementam isso. Tratar como baseline de "RPL
# sobre 802.15.4", não de "RPL sobre 6LoWPAN".
# =========================================================

[General]
network = RplNetworkGrid63
sim-time-limit = 3600s

# =========================================================
# ESCALABILIDADE / REPETIÇÕES
# =========================================================
**.numNodes = 63        # 63 sensores + 1 sink = 64 nós (grade 8x8)
warmup-period = 80s      # tempo de aquecimento antes de coletar métricas
repeat = 1000              # aumente para 1000 em rodadas estatísticas finais
num-rngs = 10

**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# =========================================================
# CONFIGURAÇÕES DE REDE
# =========================================================
**.hasIpv6 = true
**.hasIpv4 = false
**.mtu = 1500B

**.neighbourDiscovery.raEnabled = false
**.neighbourDiscovery.addRandomDelays = true
**.neighbourDiscovery.skipDad = true

# =========================================================
# PHY
# =========================================================
**.radioMedium.typename = "Ieee802154NarrowbandDimensionalRadioMedium"
**.radio.typename = "Ieee802154NarrowbandDimensionalRadio"

# Propagação: pathLossExponent igual à GRID35/GRID48, mas sigma bem mais
# alto (calibração acima) pra introduzir perda natural real na rede maior.
**.radioMedium.backgroundNoise.power = -110dBm
**.radioMedium.attenuation.typename = "LogNormalShadowing"
**.radioMedium.attenuation.pathLossExponent = 3.5
**.radioMedium.attenuation.sigma = 60.0

# =========================================================
# MAC
# =========================================================
**.wlan[*].typename = "Ieee802154NarrowbandInterface"
**.wlan[*].mac.typename = "Ieee802154Mac"

**.wlan[0].radio.transmitter.bitrate = 250kbps
**.wlan[0].radio.receiver.sensitivity = -85dBm
**.wlan[0].radio.transmitter.power = 1mW
# Reduzido do padrão (3) — combinado com o sigma elevado acima, permite
# que perdas por desvanecimento (shadowing) realmente apareçam no PDR de
# aplicação em vez de serem sempre mascaradas por retransmissão (ver
# CALIBRAÇÃO no topo do arquivo).
**.wlan[0].mac.macMaxFrameRetries = 1

# =========================================================
# RPL
# =========================================================
**.sink[*].rpl.isRoot = true
**.sink[*].rpl.storing = true
**.rpl.numDaoRetransmitAttempts = 10
**.rpl.daoEnabled = true
**.rpl.poisoning = false
**.rpl.useBackupAsPreferred = false
**.rpl.networkProtocolModule = "^.ipv6.ipv6"
**.rpl.routingTableModule = "^.ipv6.routingTable"
**.rpl.drawConnectors = true

# =========================================================
# TOPOLOGIA: GRADE 8x8 (64 posições), 63 hosts + 1 sink
# Espaçamento de 40m entre nós vizinhos (mesmo espaçamento das outras)
# =========================================================
**.numSinks = 1

**.sink[*].mobility.typename   = "StationaryMobility"
*.host[*].mobility.typename    = "StationaryMobility"
*.sink[*].mobility.initFromDisplayString = false
*.host[*].mobility.initFromDisplayString = false

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 360m
**.mobility.constraintAreaMaxY = 360m

*.sink[*].mobility.initialZ = 0m
*.host[*].mobility.initialZ = 0m

# Sink numa das 4 células mais centrais da grade 8x8 (não há centro
# exato numa grade par) — mesma âncora (160m,160m) usada como centro nas
