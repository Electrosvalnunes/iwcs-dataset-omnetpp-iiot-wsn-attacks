# =========================================================
# APLICAÇÕES UDP (tráfego legítimo apenas — cenário normal, sem ataque)
# =========================================================
**.host[*].numApps = 1
**.host[*].app[0].typename = "UdpBasicApp"
**.host[*].app[0].destAddresses = "sink[0]"
**.host[*].app[0].destPort = 1000
**.host[*].app[0].messageLength = 56B
**.host[*].app[0].sendInterval = 55s
**.host[*].app[0].startTime = uniform(0s,90s)
**.host[*].app[0].stopTime = 3550s

**.sink[*].numApps = 1
**.sink[*].app[0].typename = "UdpSink"
**.sink[*].app[0].localPort = 1000

# =========================================================
# ENERGIA
# =========================================================
**.hasStatus = true
**.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.host[*].energyStorage.nominalCapacity = 1500J
**.host[*].energyStorage.initialCapacity = 1500J
**.host[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# =========================================================
# VISUALIZAÇÃO
# =========================================================
*.visualizer.dataLinkVisualizer[*].displayLinks = true
*.visualizer.physicalLinkVisualizer[*].displayLinks = true
*.visualizer.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.networkRouteVisualizer.displayRoutes = true

*.visualizer.*.numDataLinkVisualizers = 2
*.visualizer.*.dataLinkVisualizer[*].displayLinks = true
*.visualizer.*.dataLinkVisualizer[*].activityLevel = "peer"

*.visualizer.*.dataLinkVisualizer[0].packetFilter = "UDP*"
*.visualizer.*.dataLinkVisualizer[0].*Color = "blue"

*.visualizer.*.dataLinkVisualizer[1].packetFilter = "DIO* or DIS* or DAO*"
*.visualizer.*.dataLinkVisualizer[1].*Color = "green"

# =========================================================
# MÉTRICAS (PDR, delay, throughput, energia, DIO/DIS, rank, RSSI)
# =========================================================
**.app[*].packetSent:count.record = true
**.app[*].packetReceived:count.record = true
**.host[*].app[0].recordStats = true
**.sink[*].app[0].recordStats = true

**.host[*].app[0].endToEndDelay.result-recording-modes = all
**.sink[*].app[0].endToEndDelay.result-recording-modes = all
**.endToEndDelay:vector.record = true
**.endToEndDelay:stats.record = true

**.sink[*].app[0].throughput.result-recording-modes = all
**.throughput:vector.record = true
**.throughput:stats.record = true

**.energyStorage.remainingEnergyCapacity.result-recording-modes = all
**.energyStorage.energyConsumption.result-recording-modes = all

**.scalar-recording = true
**.vector-recording = true

output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec

# =========================================================
# CONFIG: cenário normal (sem ataque) — usa o [General] diretamente
# =========================================================
[Config Grid63_Normal]
description = "Rede 63 sensores + 1 sink central, grade 8x8, tráfego RPL/UDP legítimo, sem ataque"

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
#   PDR:              3967/3972 = 99.87% — não chega aos ~98% cogitados
#                      inicialmente (ver CALIBRAÇÃO no topo do arquivo:
#                      versão que chegava lá tinha viés no delay/energia,
#                      descartada), mas é genuinamente <100%, e a
#                      prioridade — delay/energia fisicamente maiores que
#                      a GRID48 — foi alcançada.
#   Delay médio:      23.29ms (vs. 17.33ms GRID35 / 19.93ms GRID48 —
#                      agora corretamente MAIOR que as duas, +17% sobre a
#                      GRID48, coerente com a grade maior/mais saltos)
#   Delay máximo:      51.68ms (vs. 49.90ms GRID48 — também maior)
#   Energia/host:      7.31J médio de 1500J — também maior que os 7,28J
#                      da GRID48 e 7,23J da GRID35, coerente com a rede
#                      maior custando mais (inclui o custo da 1
#                      retransmissão permitida)
#   Rank:              sink=1, hosts entre 2 e 9 (vs. até 7 na GRID35/
#                      GRID48 — mais saltos, coerente com a grade maior)
#   DODAG:             converge de forma saudável, 0 nós órfãos (INF_RANK)
#
# Parâmetros finais (ver histórico de calibração no topo do arquivo):
#   macMaxFrameRetries = 1  (padrão INET: 3 — permite 1 retentativa, que
#                      é o que preserva o delay/energia realista pra
#                      pacotes que precisam retransmitir; 0 retentativas
#                      dava PDR melhor mas com viés no delay/energia)
#   sigma = 60.0 (LogNormalShadowing, padrão GRID35/GRID48: 6.0) — testado
#                      exaustivamente de 10 a 60, satura sem mais efeito
#                      além de um certo ponto; mantido alto por ser
#                      fisicamente justificável mesmo não sendo o fator
#                      dominante da perda residual (que parece ser
#                      colisão MAC, não shadowing)
#
# Aviso: esses parâmetros mudam o comportamento do MAC pra TODOS os nós
# desta topologia (não é uma configuração por-ataque) — os 4 ataques
# desta topologia, quando implementados, herdam essa mesma base, diferente
# da GRID35/GRID48 que partem de 100%.
# =========================================================

# =========================================================
# CONFIG: ataque Blackhole — host[27] como nó comprometido
#
# Mecanismo idêntico ao já validado na GRID35/GRID48 (shouldBlackholeDrop
# + maliciousRank em Rpl.cc/.h/.ned) — nenhuma mudança de código, só
# parâmetros novos no .ini.
#
# Seleção do nó: reconstruída a árvore real de encaminhamento a partir
# dos dados de rank/parentId do baseline Grid63_Normal (r=0), contando
# quantos hosts têm cada nó como ancestral:
#
#   host[27] (vizinho direto LESTE do sink, 200m,160m, rank=2) -> 22
#            descendentes (35% dos 62 outros hosts) - o mais forte
#   host[26] (vizinho direto OESTE do sink, rank=2)            -> 20
#   host[34] (vizinho direto SUL do sink, rank=2)               -> 12
#   host[19] (vizinho direto NORTE do sink, rank=2)              -> 5
#
# host[27] escolhido por ser o mais forte, seguindo o mesmo padrão do
# lado LESTE já usado na GRID48 (host[24]) — e capturando uma fração
# PROPORCIONALMENTE MAIOR da rede (35% aqui vs. ~34% em média na GRID48),
# coerente com o pedido de que o impacto nesta topologia maior deve
# superar o da GRID48.
#
# JANELA DE TEMPO: mesma padronizada (t=100s a t=3400s).
# =========================================================
[Config Grid63_Blackhole_Host27]
extends = Grid63_Normal
description = "Blackhole+Sinkhole: host[27] falsifica rank=1 via DIO e descarta tráfego de trânsito, ativo de t=100s a t=3400s"

**.host[27].rpl.maliciousRank = 1
**.host[27].rpl.attackStartTime = 100s
**.host[27].rpl.attackEndTime = 3400s

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
#   PDR:              2193/3972 = 55.21% (vs. 100% no baseline Grid63,
#                      99,87% seria mais correto comparar mas o ataque já
#                      domina — vs. 60,36% na GRID48 com host[24]: mais
#                      SEVERO aqui, como pedido — sub-árvore
#                      proporcionalmente maior (35% vs. ~34%) derruba
#                      mais tráfego)
#   Delay médio:      20,68ms (vs. 23,29ms no baseline Grid63 — mais
#                      baixo, mesmo viés de sobrevivência observado nas
#                      outras topologias: só chegam pacotes que não
#                      foram descartados no caminho)
#   Delay máximo:      51,42ms
#   Energia host[27]: 7,39J — praticamente igual ao baseline (7,31J),
#                      confirma o mesmo achado das outras 2 topologias:
#                      blackhole não tem custo energético extra pro
#                      atacante (não aumenta volume de tráfego, só
#                      redireciona/descarta o que já existe)
#   Energia rede toda: 457,81J (vs. 460,53J no baseline, 63×7,31J) —
#                      levemente MENOR que o normal, plausível: pacotes
#                      descartados perto da origem não geram o custo de
#                      retransmissão que teriam ao longo do caminho todo
#                      até o sink
#   Rank host[27]:    reverte para 2 (real) ao fim da simulação, confirma
#                      que a janela de ataque desativa corretamente
#
# Reutilizou 100% do mecanismo já validado na GRID35/GRID48
# (shouldBlackholeDrop + maliciousRank) sem nenhuma mudança de código.
# =========================================================

# =========================================================
# CONFIG: ataque Flooding — host[27] inunda o sink de tráfego UDP
#
# Mesmo nó (host[27]) e mesmo mecanismo já validado na GRID35/GRID48:
# porta separada (1001) pro flood, sink com bateria pequena (55J), taxa
# de 200 pacotes/s (0.005s) — mesma taxa calibrada nas outras 2
# topologias, já que o limiar de saturação é uma propriedade do
# RÁDIO/link direto atacante-sink (250kbps, ~150-200pkt/s de capacidade
# prática com pacotes de 152B), não do tamanho da rede.
# =========================================================
[Config Grid63_Flooding_Host27]
extends = Grid63_Normal
description = "Flooding: host[27] inunda o sink com UDP extra, ativo de t=100s a t=3400s"

**.vector-recording = false
**.sink[*].energyStorage.residualEnergyCapacity:vector.record = true

**.sink[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.sink[*].energyStorage.nominalCapacity = 55J
**.sink[*].energyStorage.initialCapacity = 55J
**.sink[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[27].numApps = 2
**.host[27].app[1].typename = "UdpBasicApp"
**.host[27].app[1].destAddresses = "sink[0]"
**.host[27].app[1].destPort = 1001
**.host[27].app[1].messageLength = 152B
**.host[27].app[1].sendInterval = 0.004s
**.host[27].app[1].startTime = 100s
**.host[27].app[1].stopTime = 3400s

**.host[27].app[1].packetSent:count.record = true
**.host[27].app[1].recordStats = true

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0, taxa final 250pkt/s/0.004s)
#
# Calibração: taxa de 200pkt/s (0.005s, igual às outras 2 topologias)
# deu PDR 44,34% — praticamente empatado com os 44,17% da GRID48 (sem
# impacto claramente maior, como pedido). Subiu pra 250pkt/s (0.004s) —
# a energia por pacote do atacante é uma propriedade fixa do link
# atacante-sink (não do tamanho da rede, por isso praticamente idêntica
# entre topologias), então precisou de mais volume pra diferenciar.
#
#   PDR legítimo (porta 1000): 1710/3972 = 43.05% (vs. 44.17% na GRID48
#                      — mais severo, como pedido)
#   PDR do flood (porta 1001): 44/825000 = 0.01% — canal genuinamente
#                      saturado, mesmo padrão das outras 2 topologias
#   Delay médio:        40.01ms (vs. ~23.29ms no baseline Grid63, +72%)
#   Delay máximo:        1190.90ms (vs. 1163.71ms na GRID48 — mais alto,
#                      fila do MAC ainda mais saturada)
#   Energia do sink:    0.147J de 55J restantes (0,27%) — quase morto,
#                      sem cruzar o bug do ModuleCrashOperation
#   Energia host[27]:  215.31J — praticamente igual aos 215.29-215.40J
#                      medidos nas outras 2 topologias (custo fixo do
#                      link, não escala com tamanho da rede)
#
# Nota: nem toda métrica fica mais severa (delay médio e energia do sink
# ficaram parecidos ou até levemente melhores que a GRID48) — o PDR
# legítimo (a métrica principal do ataque) é que ficou consistentemente
# mais severo, que era o pedido específico.
# =========================================================

# =========================================================
# CONFIG (HISTÓRICO — SUPERADO, ver Config Grid63_Wormhole_Duplo mais
# abaixo pro Wormhole OFICIAL/fechado desta topologia): ataque Wormhole
# de túnel ÚNICO, host[27] <-> host[58]
#
# Mantido no arquivo só como registro da tentativa que não bateu a meta
# de ser mais severo que a GRID48 (74,00%) — ficou em 77,32%/77,54%
# dependendo da calibração do túnel (ver RESULTADO PROVISÓRIO abaixo).
# Foi essa limitação que motivou o Wormhole DUPLO (2 túneis
# independentes), que É o resultado oficial/fechado desta topologia.
#
# Reaproveita o mecanismo FINAL já calibrado na GRID35/GRID48
# (maliciousRank=1 desde o início, não 2 — foi o que destravou o teto de
# PDR na GRID35).
#
# WH-A: host[27], mesmo atacante já validado no Blackhole/Flooding desta
# topologia (vizinho direto leste do sink, maior ponto de estrangulamento
# estrutural medido — 22 descendentes).
#
# WH-B: host[58], meio da borda SUL da grade (160m,320m) — lado oposto a
# host[27] (que fica no leste), mesmo raciocínio de espalhar o impacto
# usado na GRID48 (host[44], também meio de borda sul).
#
# JANELA DE TEMPO: mesma padronizada (100s-3400s).
# =========================================================
[Config Grid63_Wormhole_Host27_Host58]
extends = Grid63_Normal
description = "Wormhole: túnel físico host[27]<->host[58], host[58] falsifica rank=1 via DIO, ativo de t=100s a t=3400s"

**.wormholeEnabled = true
**.host[27].numPppInterfaces = 1
**.host[58].numPppInterfaces = 1

**.host[58].rpl.maliciousRank = 1
**.host[58].rpl.attackStartTime = 100s
**.host[58].rpl.attackEndTime = 3400s
**.host[58].rpl.wormholeTunnelEndpoint = true
**.host[58].rpl.wormholePeerPath = "RplNetworkGrid63.host[27]"

**.host[27].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[58].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW

# =========================================================
# RESULTADO PROVISÓRIO (3600s completo, r=0) — NÃO FECHADO
#
# Ao contrário do Blackhole/Flooding desta topologia, NÃO consegui deixar
# este ataque mais severo que a GRID48 apesar de várias tentativas:
#
#   host[58] (meio de borda sul), per=0.15/20kbps (padrão GRID35/GRID48):
#                      PDR 77.54% — sub-árvore 16/62 (25,8%)
#   host[58], per=0.25/20kbps (mais erro no túnel):
#                      PDR 77.32% — quase idêntico, per satura sem efeito
#   host[58], per=0.25/10kbps (banda reduzida, gargalo de fila):
#                      PDR 77.32% — idêntico de novo, banda também satura
#   host[0] (canto, testado por hipótese):
#                      PDR 91.92% — MUITO pior, sub-árvore só 6/62 (canto
#                      tem menos vizinhos de rádio, confirma achado já
#                      visto na GRID35)
#
# CONFIG FINAL (a menos ruim das testadas): host[58], per=0.25,
# datarate=10kbps. PDR = 77,32% — ainda ACIMA (menos severo) dos 74,00%
# da GRID48.
#
# HIPÓTESE (não totalmente confirmada): a "área de atração" do túnel
# (quantos vizinhos reais de rádio decidem trocar de rota pro atacante)
# parece ter um teto físico em torno de ~16 nós, quase independente do
# tamanho total da rede — mesma ordem de grandeza capturada na GRID48
# (14 nós) e GRID35 (12 nós). Como a GRID63 tem mais nós no total (62
# outros hosts, vs. 47 na GRID48), a MESMA sub-árvore absoluta vira uma
# fatia proporcionalmente MENOR da rede (25,8% vs. 29,2%), diluindo o
# impacto agregado no PDR mesmo com o mecanismo de captura idêntico.
#
# Energia dos atacantes (host27=29,35J, host58=28,86J) continua bem
# acima do normal e na mesma faixa das outras 2 topologias — essa parte
# do "impacto maior" não foi prejudicada.
#
# ATUALIZAÇÃO: a ideia do segundo túnel foi testada depois (ver Config
# Grid63_Wormhole_Duplo mais abaixo) e FUNCIONOU — PDR caiu pra 54,18%,
# superando a meta da GRID48 (74,00%) com folga. Este Config de túnel
# único fica só como registro histórico da calibração; o resultado
# OFICIAL/fechado do Wormhole nesta topologia é o duplo.
# =========================================================

# =========================================================
# CONFIG: ataque Backoff Manipulado — host[27] desliga o CSMA/CA
#
# Mesmo nó (host[27]) já usado no Blackhole/Flooding/Wormhole desta
# topologia, mesma taxa final calibrada na GRID35/GRID48 (55pkt/s /
# 0,0182s) como ponto de partida — testar abaixo e escalar se
# necessário pra garantir impacto maior que a GRID48 (PDR 83,45%),
# conforme pedido.
# =========================================================
[Config Grid63_Backoff_Host27]
extends = Grid63_Normal
description = "Backoff Manipulado: host[27] zera o CSMA/CA (macMinBE=macMaxBE=macMaxCSMABackoffs=0), monopolizando o canal de rádio contra os vizinhos"

**.host[27].wlan[0].mac.macMinBE = 0
**.host[27].wlan[0].mac.macMaxBE = 0
**.host[27].wlan[0].mac.macMaxCSMABackoffs = 0

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[27].numApps = 2
**.host[27].app[1].typename = "UdpBasicApp"
**.host[27].app[1].destAddresses = "sink[0]"
**.host[27].app[1].destPort = 1001
**.host[27].app[1].messageLength = 152B
**.host[27].app[1].sendInterval = 0.0182s
**.host[27].app[1].startTime = 100s
**.host[27].app[1].stopTime = 3400s
**.host[27].app[1].packetSent:count.record = true

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
# Reaproveitando direto a taxa final calibrada na GRID35/GRID48
# (55pkt/s / 0,0182s), o PDR já saiu mais severo que a GRID48 sem
# precisar escalar:
#
#   PDR legítimo (porta 1000): 3075/3972 = 77.42% (vs. 83,45% na GRID48
#                      — mais severo, como pedido)
#   PDR do enchimento (porta 1001): 181115/181319 = 99.89% — mesmo
#                      achado das outras 2 topologias: o atacante quase
#                      não perde os próprios pacotes mesmo causando
#                      colisão real nos vizinhos
#   Delay médio:        37.79ms (vs. 36,55ms na GRID48 — também maior)
#   Delay máximo:        173.23ms
#   Energia host[27]:   208.45J — praticamente idêntica aos 208,36J da
#                      GRID48 (custo fixo do próprio atacante, não
#                      escala com o tamanho da rede)
#   Energia rede toda:  740.14J (vs. 460,76J no baseline, +60,7% — em
#                      valor absoluto maior que os 631,64J da GRID48,
#                      mas em variação percentual um pouco menor que os
#                      +80,7% de lá, mesmo padrão de diluição percentual
#                      já visto no Wormhole desta topologia)
#
# Métrica principal (PDR) ficou mais severa como pedido; energia da rede
# em termos absolutos também é maior (mais hosts), mesmo com a variação
# percentual um pouco diluída.
# =========================================================

# =========================================================
# CONFIG: ataque Wormhole DUPLO — 2 túneis independentes
#
# Tentativa de superar a GRID48 (74,00%) depois do túnel único ficar em
# 77,32% (menos severo). Hipótese: a "área de atração" de um único
# túnel tem um teto físico (~16 nós), então em vez de tentar capturar
# mais gente com UM túnel, usa DOIS túneis independentes simultâneos,
# cada um atraindo sua própria sub-árvore separada:
#
#   Túnel 1: host[27] (leste do sink, 22 descendentes naturais) <->
#            host[58] (meio de borda sul) — já validado sozinho, 16 nós
#   Túnel 2: host[26] (oeste do sink, 20 descendentes naturais) <->
#            host[3] (meio de borda norte, não testado antes)
#
# Mesmo mecanismo (maliciousRank=1, per=0.25/10kbps) replicado pro
# segundo par. Mesma janela de tempo (100s-3400s) pros dois.
# =========================================================
[Config Grid63_Wormhole_Duplo]
extends = Grid63_Normal
description = "Wormhole duplo: 2 túneis independentes host[27]<->host[58] e host[26]<->host[3], ativos de t=100s a t=3400s"

**.wormholeEnabled = true
**.wormholeEnabled2 = true

**.host[27].numPppInterfaces = 1
**.host[58].numPppInterfaces = 1
**.host[26].numPppInterfaces = 1
**.host[3].numPppInterfaces = 1

**.host[58].rpl.maliciousRank = 1
**.host[58].rpl.attackStartTime = 100s
**.host[58].rpl.attackEndTime = 3400s
**.host[58].rpl.wormholeTunnelEndpoint = true
**.host[58].rpl.wormholePeerPath = "RplNetworkGrid63.host[27]"

**.host[3].rpl.maliciousRank = 1
**.host[3].rpl.attackStartTime = 100s
**.host[3].rpl.attackEndTime = 3400s
**.host[3].rpl.wormholeTunnelEndpoint = true
**.host[3].rpl.wormholePeerPath = "RplNetworkGrid63.host[26]"

**.host[27].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[58].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[26].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[3].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW

