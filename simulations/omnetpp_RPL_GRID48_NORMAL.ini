#                      GRID35, confirma que o receiverIdlePowerConsumption
#                      elevado (8mW) reproduz o mesmo custo extra
#                      calibrado lá, independente do tamanho da rede
#   Energia rede toda: 390,52J (soma dos 48 hosts) vs 349,45J no baseline
