#                      custo extra real, o resto da rede fica parado)
# =========================================================

# =========================================================
# CONFIG: ataque Backoff Manipulado — host[24] desliga o CSMA/CA
#
# Reaproveita o mecanismo FINAL já calibrado na GRID35 (Config
# Grid35_Backoff_Host20, v7 depois de calibração de taxa — ver histórico
# completo lá) sem repetir a descoberta do zero: mesmo host[24] já usado
# no Blackhole/Flooding/Wormhole desta topologia, macMinBE=macMaxBE=
# macMaxCSMABackoffs=0 (sempre ativo, mesma limitação do INET
# compartilhado já documentada na GRID35), porta separada (1001) pro
# tráfego de "enchimento" que dá a host[24] chances de monopolizar o
# canal, taxa final calibrada de 55pkt/s (0.0182s) e janela padronizada
# 100s-3400s no app[1].
# =========================================================
[Config Grid48_Backoff_Host24]
extends = Grid48_Normal
description = "Backoff Manipulado: host[24] zera o CSMA/CA (macMinBE=macMaxBE=macMaxCSMABackoffs=0), monopolizando o canal de rádio contra os vizinhos"

**.host[24].wlan[0].mac.macMinBE = 0
**.host[24].wlan[0].mac.macMaxBE = 0
**.host[24].wlan[0].mac.macMaxCSMABackoffs = 0

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[24].numApps = 2
**.host[24].app[1].typename = "UdpBasicApp"
**.host[24].app[1].destAddresses = "sink[0]"
**.host[24].app[1].destPort = 1001
**.host[24].app[1].messageLength = 152B
**.host[24].app[1].sendInterval = 0.0182s
**.host[24].app[1].startTime = 100s
**.host[24].app[1].stopTime = 3400s
**.host[24].app[1].packetSent:count.record = true

