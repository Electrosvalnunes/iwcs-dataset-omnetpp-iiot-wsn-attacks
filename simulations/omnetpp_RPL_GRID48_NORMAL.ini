# =========================================================
# BASELINE: RPL sobre IEEE 802.15.4 (48 hosts + 1 sink, grade 7x7)
# Irmã maior da RplNetworkGrid35 (mesma abordagem validada, escalada de
# 6x6/35 hosts pra 7x7/48 hosts) — ainda não validado com repetições
# completas, ver bloco de resultado no Config Grid48_Normal assim que
# for medido.
#
# RESSALVA 1 — dependência escondida fora deste arquivo (idêntica à do
# GRID35_NORMAL.ini):
# O PDR depende de uma correção feita em src/Rpl.cc (compilada em
# libMAIO_RPL27.so), NÃO deste .ini. Sem ela, destAddresses="sink[0]" resolve
# para o endereço link-local do sink (raEnabled=false => nenhum nó forma
# endereço global via SLAAC) e o INET recusa encaminhar link-local além de 1
# salto — derrubando o PDR pra só os vizinhos diretos do sink entregarem. A
# correção assina um endereço global adicional (fd00::/8) em Rpl::start().
#
# RESSALVA 2 — isto NÃO é uma pilha 6LoWPAN completa:
# É RPL rodando direto sobre IPv6 + MAC IEEE 802.15.4. Não há camada de
# adaptação 6LoWPAN (sem compressão IPHC / RFC 6282, sem fragmentação) —
# RplRouter/AdhocHost não implementam isso. Tratar como baseline de "RPL
# sobre 802.15.4", não de "RPL sobre 6LoWPAN".
# =========================================================

[General]
network = RplNetworkGrid48
sim-time-limit = 3600s

# =========================================================
# ESCALABILIDADE / REPETIÇÕES
# =========================================================
**.numNodes = 48        # 48 sensores + 1 sink = 49 nós (grade 7x7)
warmup-period = 80s      # tempo de aquecimento antes de coletar métricas
repeat = 1000              # aumente para 1000 em rodadas estatísticas finais
num-rngs = 10

**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# =========================================================
# CONFIGURAÇÕES DE REDE
# =========================================================
**.hasIpv6 = true
**.hasIpv4 = false
**.mtu = 1500B

**.neighbourDiscovery.raEnabled = false
**.neighbourDiscovery.addRandomDelays = true
**.neighbourDiscovery.skipDad = true

# =========================================================
# PHY
# =========================================================
**.radioMedium.typename = "Ieee802154NarrowbandDimensionalRadioMedium"
**.radio.typename = "Ieee802154NarrowbandDimensionalRadio"

# Propagação mais realista (ambiente interno)
**.radioMedium.backgroundNoise.power = -110dBm
**.radioMedium.attenuation.typename = "LogNormalShadowing"
**.radioMedium.attenuation.pathLossExponent = 3.5
**.radioMedium.attenuation.sigma = 6.0

# =========================================================
# MAC
# =========================================================
**.wlan[*].typename = "Ieee802154NarrowbandInterface"
**.wlan[*].mac.typename = "Ieee802154Mac"

**.wlan[0].radio.transmitter.bitrate = 250kbps
**.wlan[0].radio.receiver.sensitivity = -85dBm
**.wlan[0].radio.transmitter.power = 1mW

# =========================================================
# RPL
# =========================================================
**.sink[*].rpl.isRoot = true
**.sink[*].rpl.storing = true
**.rpl.numDaoRetransmitAttempts = 10
**.rpl.daoEnabled = true
**.rpl.poisoning = false
**.rpl.useBackupAsPreferred = false
**.rpl.networkProtocolModule = "^.ipv6.ipv6"
**.rpl.routingTableModule = "^.ipv6.routingTable"
**.rpl.drawConnectors = true

# =========================================================
# TOPOLOGIA: GRADE 7x7 (49 posições), 48 hosts + 1 sink no centro
# Espaçamento de 40m entre nós vizinhos (mesmo espaçamento da GRID35)
# =========================================================
**.numSinks = 1

**.sink[*].mobility.typename   = "StationaryMobility"
*.host[*].mobility.typename    = "StationaryMobility"
*.sink[*].mobility.initFromDisplayString = false
*.host[*].mobility.initFromDisplayString = false

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 320m
**.mobility.constraintAreaMaxY = 320m

*.sink[*].mobility.initialZ = 0m
*.host[*].mobility.initialZ = 0m

# Sink no centro da grade (posição da célula [col=3,row=3] da grade 7x7)
*.sink[0].mobility.initialX = 160m
*.sink[0].mobility.initialY = 160m

# Linha 0 (Y = 40m)
*.host[0].mobility.initialX = 40m
*.host[0].mobility.initialY = 40m
*.host[1].mobility.initialX = 80m
*.host[1].mobility.initialY = 40m
*.host[2].mobility.initialX = 120m
*.host[2].mobility.initialY = 40m
*.host[3].mobility.initialX = 160m
*.host[3].mobility.initialY = 40m
*.host[4].mobility.initialX = 200m
*.host[4].mobility.initialY = 40m
*.host[5].mobility.initialX = 240m
*.host[5].mobility.initialY = 40m
*.host[6].mobility.initialX = 280m
*.host[6].mobility.initialY = 40m

# Linha 1 (Y = 80m)
*.host[7].mobility.initialX = 40m
*.host[7].mobility.initialY = 80m
*.host[8].mobility.initialX = 80m
*.host[8].mobility.initialY = 80m
*.host[9].mobility.initialX = 120m
*.host[9].mobility.initialY = 80m
*.host[10].mobility.initialX = 160m
*.host[10].mobility.initialY = 80m
*.host[11].mobility.initialX = 200m
*.host[11].mobility.initialY = 80m
*.host[12].mobility.initialX = 240m
*.host[12].mobility.initialY = 80m
*.host[13].mobility.initialX = 280m
*.host[13].mobility.initialY = 80m

# Linha 2 (Y = 120m)
*.host[14].mobility.initialX = 40m
*.host[14].mobility.initialY = 120m
*.host[15].mobility.initialX = 80m
*.host[15].mobility.initialY = 120m
*.host[16].mobility.initialX = 120m
*.host[16].mobility.initialY = 120m
*.host[17].mobility.initialX = 160m
*.host[17].mobility.initialY = 120m
*.host[18].mobility.initialX = 200m
*.host[18].mobility.initialY = 120m
*.host[19].mobility.initialX = 240m
*.host[19].mobility.initialY = 120m
*.host[20].mobility.initialX = 280m
*.host[20].mobility.initialY = 120m

# Linha 3 (Y = 160m) — célula central [col=3] ocupada pelo sink, pulada aqui
*.host[21].mobility.initialX = 40m
*.host[21].mobility.initialY = 160m
*.host[22].mobility.initialX = 80m
*.host[22].mobility.initialY = 160m
*.host[23].mobility.initialX = 120m
*.host[23].mobility.initialY = 160m
*.host[24].mobility.initialX = 200m
*.host[24].mobility.initialY = 160m
*.host[25].mobility.initialX = 240m
*.host[25].mobility.initialY = 160m
*.host[26].mobility.initialX = 280m
*.host[26].mobility.initialY = 160m

# Linha 4 (Y = 200m)
*.host[27].mobility.initialX = 40m
*.host[27].mobility.initialY = 200m
*.host[28].mobility.initialX = 80m
*.host[28].mobility.initialY = 200m
*.host[29].mobility.initialX = 120m
*.host[29].mobility.initialY = 200m
*.host[30].mobility.initialX = 160m
*.host[30].mobility.initialY = 200m
*.host[31].mobility.initialX = 200m
*.host[31].mobility.initialY = 200m
*.host[32].mobility.initialX = 240m
*.host[32].mobility.initialY = 200m
*.host[33].mobility.initialX = 280m
*.host[33].mobility.initialY = 200m

# Linha 5 (Y = 240m)
*.host[34].mobility.initialX = 40m
*.host[34].mobility.initialY = 240m
*.host[35].mobility.initialX = 80m
*.host[35].mobility.initialY = 240m
*.host[36].mobility.initialX = 120m
*.host[36].mobility.initialY = 240m
*.host[37].mobility.initialX = 160m
*.host[37].mobility.initialY = 240m
*.host[38].mobility.initialX = 200m
*.host[38].mobility.initialY = 240m
*.host[39].mobility.initialX = 240m
*.host[39].mobility.initialY = 240m
*.host[40].mobility.initialX = 280m
*.host[40].mobility.initialY = 240m

# Linha 6 (Y = 280m)
*.host[41].mobility.initialX = 40m
*.host[41].mobility.initialY = 280m
*.host[42].mobility.initialX = 80m
*.host[42].mobility.initialY = 280m
*.host[43].mobility.initialX = 120m
*.host[43].mobility.initialY = 280m
*.host[44].mobility.initialX = 160m
*.host[44].mobility.initialY = 280m
*.host[45].mobility.initialX = 200m
*.host[45].mobility.initialY = 280m
*.host[46].mobility.initialX = 240m
*.host[46].mobility.initialY = 280m
*.host[47].mobility.initialX = 280m
*.host[47].mobility.initialY = 280m

# =========================================================
# APLICAÇÕES UDP (tráfego legítimo apenas — cenário normal, sem ataque)
# =========================================================
**.host[*].numApps = 1
**.host[*].app[0].typename = "UdpBasicApp"
**.host[*].app[0].destAddresses = "sink[0]"
**.host[*].app[0].destPort = 1000
**.host[*].app[0].messageLength = 56B
**.host[*].app[0].sendInterval = 55s
**.host[*].app[0].startTime = uniform(0s,90s)
**.host[*].app[0].stopTime = 3550s

**.sink[*].numApps = 1
**.sink[*].app[0].typename = "UdpSink"
**.sink[*].app[0].localPort = 1000

# =========================================================
# ENERGIA
# =========================================================
# IdealEpEnergyStorage ignora nominalCapacity/initialCapacity por design (é um
# armazenamento "infinito" — ver inet/power/storage/IdealEpEnergyStorage.cc).
# Para a capacidade realmente ter efeito (e clampar entre 0 e nominalCapacity,
# sem ficar negativa), precisa ser SimpleEpEnergyStorage.
# SimpleEpEnergyStorage exige o submódulo NodeStatus (usado para "crashar" o nó
# quando a bateria zera), que vem desligado por padrão no INET.
**.hasStatus = true
**.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
# 1500J dá margem confortável, mesma referência usada na GRID35 (~1007J/host
# em 3600s no cenário normal); reconferir depois da 1a rodada de validação.
**.host[*].energyStorage.nominalCapacity = 1500J
**.host[*].energyStorage.initialCapacity = 1500J
**.host[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# =========================================================
# VISUALIZAÇÃO
# =========================================================
*.visualizer.dataLinkVisualizer[*].displayLinks = true
*.visualizer.physicalLinkVisualizer[*].displayLinks = true
*.visualizer.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.networkRouteVisualizer.displayRoutes = true

*.visualizer.*.numDataLinkVisualizers = 2
*.visualizer.*.dataLinkVisualizer[*].displayLinks = true
*.visualizer.*.dataLinkVisualizer[*].activityLevel = "peer"

# Tráfego UDP legítimo
*.visualizer.*.dataLinkVisualizer[0].packetFilter = "UDP*"
*.visualizer.*.dataLinkVisualizer[0].*Color = "blue"

# Mensagens de controle RPL
*.visualizer.*.dataLinkVisualizer[1].packetFilter = "DIO* or DIS* or DAO*"
*.visualizer.*.dataLinkVisualizer[1].*Color = "green"

# =========================================================
# MÉTRICAS (PDR, delay, throughput, energia, DIO/DIS, rank)
# =========================================================
**.app[*].packetSent:count.record = true
**.app[*].packetReceived:count.record = true
**.host[*].app[0].recordStats = true
**.sink[*].app[0].recordStats = true

**.host[*].app[0].endToEndDelay.result-recording-modes = all
**.sink[*].app[0].endToEndDelay.result-recording-modes = all
**.endToEndDelay:vector.record = true
**.endToEndDelay:stats.record = true

**.sink[*].app[0].throughput.result-recording-modes = all
**.throughput:vector.record = true
**.throughput:stats.record = true

**.energyStorage.remainingEnergyCapacity.result-recording-modes = all
**.energyStorage.energyConsumption.result-recording-modes = all

**.scalar-recording = true
**.vector-recording = true

output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec

# =========================================================
# CONFIG: cenário normal (sem ataque) — usa o [General] diretamente
# =========================================================
[Config Grid48_Normal]
description = "Rede 48 sensores + 1 sink central, grade 7x7, tráfego RPL/UDP legítimo, sem ataque"

# =========================================================
# RESULTADO VALIDADO (2 repetições completas, r=0..1, 3600s cada)
#
#   PDR:              100.00% nas duas repetições (3027/3027 em r=0)
#   Delay médio:      19.93ms (r=0) / 19.76ms (r=1) — vs. 17.33ms na
#                      GRID35, levemente maior, coerente com uma grade
#                      fisicamente maior/mais saltos até o sink
#   Delay máximo:      49.90ms (r=0) / 39.01ms (r=1) — vs. 37.73ms na GRID35
#   Energia/host:      7.28J (r=0) / 7.24J (r=1) médio de 1500J — bate com
#                      os ~7.24J/host medidos na GRID35, sem residual
#                      negativo em nenhum nó em nenhuma das 2 repetições
#   Rank:              sink=1, hosts entre 2 e 7 (mesma faixa da GRID35,
#                      grade maior mas diâmetro de rede parecido)
#
# DODAG converge de forma saudável e estável entre repetições (baixa
# variância: PDR idêntico, delay/energia com diferença <1%), sem sinais
# de bug. Baseline pronto pra servir de referência aos ataques que forem
# implementados nesta topologia (mesmo padrão incremental usado na
# GRID35: Blackhole, Flooding, Wormhole, Backoff).
#
# 2 repetições completas (r=0,1), consideradas suficientes pra fechar
# este baseline — não as 10 completas do [General] (repeat=10, mantido
# como teto pra rodadas estatísticas finais se algum dia for preciso).
# =========================================================

# =========================================================
# CONFIG: ataque Blackhole — host[24] como nó comprometido
#
# Mecanismo idêntico ao já validado na GRID35 (Config
# Grid35_Blackhole_Host20): reutiliza o código genérico já existente em
# src/Rpl.cc/.h/.ned (shouldBlackholeDrop() + updatePrefParent() com
# maliciousRank, agendado por attackStartTime/attackEndTime) — não
# precisou nenhuma mudança de código, só parâmetros novos no .ini.
#
# Seleção do nó: reconstruída a árvore real de encaminhamento a partir
# dos dados de rank/parentId das 2 repetições do baseline Grid48_Normal
# (getNodeId() em Rpl.cc devolve o índice do host a partir do nome do
# módulo pai, ou -1 se o pai for o sink), contando quantos hosts têm
# cada nó como ancestral:
#
#   host[24] (vizinho direto LESTE do sink, 200m,160m, rank=2) -> 20
#            descendentes em r=0, 13 em r=1 (média ~16,5) - o mais forte
#            e mais consistente nas 2 repetições
#   host[17] (vizinho direto NORTE do sink, rank=2)            -> 7 em
#            r=0, 17 em r=1 - mais variável entre rodadas
#   host[23] (vizinho direto OESTE do sink, rank=2)            -> 15 em
#            r=0, 9 em r=1
#
# host[24] escolhido por ser o candidato mais forte E mais estável entre
# as 2 repetições — mesmo critério de seleção usado pra host[20] na
# GRID35 (maior ponto de estrangulamento estrutural da DODAG).
#
# JANELA DE TEMPO: mesma janela padronizada usada em todos os ataques da
# GRID35 (t=100s a t=3400s) — rede já convergida (warmup-period=80s) antes
# do ataque começar, com janela de recuperação até o fim da simulação.
# =========================================================
[Config Grid48_Blackhole_Host24]
extends = Grid48_Normal
description = "Blackhole+Sinkhole: host[24] falsifica rank=1 via DIO e descarta tráfego de trânsito, ativo de t=100s a t=3400s"

**.host[24].rpl.maliciousRank = 1
**.host[24].rpl.attackStartTime = 100s
**.host[24].rpl.attackEndTime = 3400s

# =========================================================
# RESULTADO VALIDADO (2 repetições completas, r=0..1, 3600s cada)
#
#   PDR:              60.36% (r=0) / 60.37% (r=1) — média 60.36%,
#                      desvio de só 0,01% entre as 2 repetições (vs.
#                      100% no baseline Grid48_Normal). Comparável ao
#                      54,51% medido na GRID35 (host[20]), com host[24]
#                      controlando uma fatia um pouco menor da rede (a
#                      grade 7x7 é maior, o mesmo nó captura uma fração
#                      um pouco menor do total de 48 hosts do que host[20]
#                      capturava dos 35 da GRID35)
#   Delay médio:      18.38ms (r=0) / 18.41ms (r=1) — praticamente igual
#                      ao normal (19,93/19,76ms), com viés de sobrevivência
#                      leve (só chegam pacotes não descartados no caminho,
#                      mesmo padrão observado na GRID35)
#   Energia host[24]: 7.34J (r=0) / 7.30J (r=1) — praticamente idêntica ao
#                      baseline (~7,24-7,28J), confirmando o mesmo achado
#                      da GRID35: blackhole/sinkhole é ataque de
#                      integridade/disponibilidade (descarta e redireciona
#                      tráfego já existente, não aumenta o volume total na
#                      rede), não de exaustão de energia — diferente de
#                      flooding/wormhole
#   Rank host[24]:    reverte para 2 (real) ao fim da simulação, confirma
#                      que a janela de ataque (100s-3400s) desativa
#                      corretamente antes do fim (3600s)
#   Energia rede toda: 348,80J (soma dos 48 hosts, r=0) vs 349,45J no
#                      baseline normal — praticamente igual (-0,2%),
#                      mesmo achado da GRID35 (blackhole não tem
#                      assinatura energética de rede)
#
# Reutilizou 100% do mecanismo já validado na GRID35 (shouldBlackholeDrop
# + maliciousRank em Rpl.cc/.h/.ned) sem nenhuma mudança de código —
# só parâmetros novos no .ini, confirmando que a implementação é
# genérica/reutilizável entre topologias.
# =========================================================

# =========================================================
# CONFIG: ataque Flooding — host[24] inunda o sink de tráfego UDP
#
# Mesmo nó (host[24]) e mesmo mecanismo já validado na GRID35 (Config
# Grid35_Flooding_Host20): porta separada (1001) pro flood, sink com
# bateria pequena e deliberada (SimpleEpEnergyStorage) pra observar
# esgotamento real, taxa de 200 pacotes/s (0.005s) — a mesma taxa
# calibrada na GRID35 pra cruzar o limiar de saturação do canal
# 802.15.4/250kbps (~150-200pkt/s de capacidade prática com pacotes de
# 152B). Esse limiar é uma propriedade do RÁDIO/link direto
# atacante-sink, não do tamanho da rede, então a mesma taxa deveria
# continuar válida aqui — testado abaixo e confirmado.
# =========================================================
[Config Grid48_Flooding_Host24]
extends = Grid48_Normal
description = "Flooding: host[24] inunda o sink com UDP extra, ativo de t=100s a t=3400s"

**.vector-recording = false
**.sink[*].energyStorage.residualEnergyCapacity:vector.record = true

**.sink[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.sink[*].energyStorage.nominalCapacity = 55J
**.sink[*].energyStorage.initialCapacity = 55J
**.sink[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

**.sink[*].numApps = 2
**.sink[*].app[1].typename = "UdpSink"
**.sink[*].app[1].localPort = 1001
**.sink[*].app[1].recordStats = true

**.host[24].numApps = 2
**.host[24].app[1].typename = "UdpBasicApp"
**.host[24].app[1].destAddresses = "sink[0]"
**.host[24].app[1].destPort = 1001
**.host[24].app[1].messageLength = 152B
**.host[24].app[1].sendInterval = 0.005s
**.host[24].app[1].startTime = 100s
**.host[24].app[1].stopTime = 3400s

**.host[24].app[1].packetSent:count.record = true
**.host[24].app[1].recordStats = true

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
# Confirmado com a simulação completa (a amostra parcial de 300s tinha
# estimado 50,00% de PDR e projetado ~0,9J de sink ao fim — bateu bem
# perto):
#
#   PDR legítimo (porta 1000):  1337/3027 = 44.17% — praticamente
#                      idêntico ao 44,61% medido na GRID35 completa
#   PDR do flood (porta 1001):  47/660000 = 0.01% — canal genuinamente
#                      saturado, o próprio atacante quase não entrega o
#                      que envia (idêntico ao 0,01% da GRID35)
#   Delay médio:        43,92ms (vs. ~19,9ms no normal, +121%)
#   Delay máximo:        1163,71ms (vs. 1123,79ms na GRID35 — mesma
#                      ordem de grandeza, fila do MAC saturada)
#   Energia do sink:    0,054J de 55J restantes (0,1%) — quase morto,
#                      confirmando a projeção linear da amostra parcial
#                      (~0,9J estimados), sem cruzar o bug do
#                      ModuleCrashOperation
#   Energia host[24]:  215,40J — praticamente idêntica aos 215,29J
#                      medidos na GRID35, confirma que o custo de operar
#                      o flood na taxa calibrada é uma propriedade do
#                      link atacante-sink, não do tamanho da rede
#   Energia rede toda: 645,17J (soma dos 48 hosts, sink tem bateria
#                      separada de 55J e não entra nessa soma) vs 349,45J
#                      no baseline normal (+84,6% — a assinatura
#                      energética mais forte de rede entre os 4 ataques,
#                      mesmo padrão da GRID35)
# =========================================================

# =========================================================
# CONFIG: ataque Wormhole — túnel privado host[24] <-> host[44]
#
# Reaproveita o mecanismo FINAL já calibrado na GRID35 (Config
# Grid35_Wormhole_Host20_Host0, v7 depois de 7 rodadas de calibração —
# ver histórico completo lá) sem repetir a descoberta do zero: começa já
# com maliciousRank=1 (não 2), que foi o que destravou o teto de PDR na
# GRID35 ao vencer qualquer alternativa real dos vizinhos E cascatear
# pros vizinhos-dos-vizinhos.
#
# WH-A: host[24], mesmo atacante já validado no Blackhole/Flooding desta
# topologia (vizinho direto leste do sink, maior ponto de estrangulamento
# estrutural medido).
#
# WH-B: host[44], meio da borda SUL da grade (160m,280m) — lado oposto a
# host[24] (que fica no lado leste), pra espalhar o impacto por uma
# região diferente da rede em vez de concentrar tudo perto de host[24].
# Posição de meio-de-borda (não canto) pra ter até 5 vizinhos de rádio
# possíveis, mesmo raciocínio já validado na GRID35 (host[3] preferido a
# host[0]).
#
# Mecanismo idêntico ao validado na GRID35 (túnel PPP real via
# numPppInterfaces, filtro de DIO/DAO no túnel em processPacket(), rota
# /128 conflitante removida em activateWormholeTunnel() — tudo já
# genérico em Rpl.cc, nenhuma mudança de código necessária) e mesma
# janela de tempo padronizada (100s-3400s).
# =========================================================
[Config Grid48_Wormhole_Host24_Host44]
extends = Grid48_Normal
description = "Wormhole: túnel físico host[24]<->host[44], host[44] falsifica rank=1 via DIO, ativo de t=100s a t=3400s"

**.wormholeEnabled = true
**.host[24].numPppInterfaces = 1
**.host[44].numPppInterfaces = 1

**.host[44].rpl.maliciousRank = 1
**.host[44].rpl.attackStartTime = 100s
**.host[44].rpl.attackEndTime = 3400s
**.host[44].rpl.wormholeTunnelEndpoint = true
**.host[44].rpl.wormholePeerPath = "RplNetworkGrid48.host[24]"

**.host[24].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW
**.host[44].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 8mW

# =========================================================
# RESULTADO VALIDADO (3600s completo, r=0)
#
# Reaproveitando direto o mecanismo FINAL da GRID35 (v7, sem repetir a
# calibração de 7 rodadas de lá), os números já saíram fortes e na mesma
# ordem de grandeza sem nenhum ajuste. Confirmado com a simulação
# completa de 3600s (a amostra parcial de 800s tinha estimado 74,64% de
# PDR — bateu quase exato):
#
#   PDR:                2240/3027 = 74.00% (vs. 69,43% na GRID35
#                      completa — mesma ordem de grandeza)
#   Sub-árvore afetada: 14 de 48 nós (29,2% da rede) atraídos por
#                      host[44] (vs. 12/35 = 34,2% na GRID35 — proporção
#                      um pouco menor, grade maior dilui um pouco o
#                      alcance do "atalho" falso)
#   Delay médio:        30,27ms (vs. ~19,9ms no normal, +52%)
#   Delay máximo:        398,17ms — bate com a assinatura do túnel (300ms
#                      de delay do canal wormholeTunnel48 + latência
#                      normal), mesmo sinal de detecção clássico de
#                      wormhole observado na GRID35 (373,71ms lá)
#   Energia host[24]:   28,87J   Energia host[44]: 28,41J — praticamente
